<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoScene — Analyse image par image</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <span>VideoScene</span>
    </div>
    <p class="tagline">Analyse scène par scène — horodatage précis</p>
  </header>

  <main>
    <!-- Zone d'upload -->
    <section id="upload-section">
      <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Zone de dépôt de vidéo">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="drop-title">Déposez votre vidéo ici</p>
        <p class="drop-sub">ou <span class="link-text">cliquez pour sélectionner</span></p>
        <p class="drop-hint">MP4, MOV, AVI, WebM — max 15 minutes</p>
        <input type="file" id="file-input" accept="video/*" hidden />
      </div>

      <div id="file-preview" class="file-preview hidden">
        <div class="preview-info">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <div class="preview-text">
            <span id="file-name">—</span>
            <span id="file-size" class="muted">—</span>
          </div>
          <button id="reset-btn" class="icon-btn" title="Changer de vidéo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/>
            </svg>
          </button>
        </div>

        <!-- Sélecteur de mode -->
        <div class="mode-toggle" role="group" aria-label="Mode d'analyse">
          <label class="mode-option active" id="label-summary">
            <input type="radio" name="mode" value="summary" checked />
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>Résumé par scène</span>
            <em>~1 frame/30s</em>
          </label>
          <label class="mode-option" id="label-narrative">
            <input type="radio" name="mode" value="narrative" />
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Script narratif</span>
            <em>~1 frame/5s · exhaustif</em>
          </label>
        </div>

        <button id="analyze-btn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Analyser la vidéo
        </button>
      </div>
    </section>

    <!-- Progression -->
    <section id="progress-section" class="hidden">
      <div class="progress-header">
        <h2 id="progress-title">Initialisation…</h2>
        <span id="progress-counter" class="badge">0 / 0</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar" style="width:0%"></div>
      </div>
      <p id="progress-status" class="muted progress-status">Démarrage de l'analyse…</p>
    </section>

    <!-- Résultats -->
    <section id="results-section" class="hidden">
      <div class="results-header">
        <div>
          <h2 id="results-title">Résultats de l'analyse</h2>
          <p id="results-meta" class="muted"></p>
        </div>
        <div class="results-actions">
          <button id="export-json-btn" class="btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            JSON
          </button>
          <button id="export-txt-btn" class="btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            Script TXT
          </button>
          <button id="new-btn" class="btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nouvelle vidéo
          </button>
        </div>
      </div>

      <!-- Timeline (résumé) ou Script (narratif) -->
      <div id="output-area"></div>
    </section>

    <!-- Erreur -->
    <div id="error-banner" class="error-banner hidden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="error-text"></span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
